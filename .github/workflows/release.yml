name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para o nome do artefato (ex.: 0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write   # necessário para criar o Release e anexar o APK

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android keystore (se configurado)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Keystore não configurado — gerando APK de debug."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (release assinado)
        if: steps.keystore.outputs.signed == 'true'
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=DEMO_MODE="${{ secrets.SUPABASE_URL == '' && 'true' || 'false' }}"

      - name: Build APK (fallback debug)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          flutter build apk --debug \
            --dart-define=DEMO_MODE=true

      - name: Rename artifact
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p dist
          SRC=$(find build/app/outputs/flutter-apk -name '*.apk' | head -n1)
          cp "$SRC" "dist/imperiall-game-${VERSION}.apk"
          echo "APK: dist/imperiall-game-${VERSION}.apk"
          ls -lh dist

      - name: Upload APK (artifact da run)
        uses: actions/upload-artifact@v4
        with:
          name: imperiall-game-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
