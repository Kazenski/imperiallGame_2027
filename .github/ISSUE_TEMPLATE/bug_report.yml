name: Bug report
description: Reporte um comportamento incorreto
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! **Não** inclua dados sensíveis, chaves ou `.env` aqui.
        Para vulnerabilidades de segurança, use o canal privado descrito em SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu
      description: Descreva o comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra a tela de missões
        2. Conclua um treino
        3. O XP não subiu
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Android
        - iOS
        - Windows
        - Outro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do app
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas
      render: shell
    validations:
      required: false
