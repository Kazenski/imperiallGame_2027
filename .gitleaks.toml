# Configuracao do gitleaks.
# Documentacao: https://github.com/gitleaks/gitleaks

title = "imperiallGame_2027"

[extend]
useDefault = true

[allowlist]
description = "Arquivos que legitimamente contem exemplos/placeholder de segredos"
paths = [
  '''^\.env\.example$''',
  '''^docs/SECURITY\.md$''',
  '''^docs/CHANGELOG_POLICY\.md$''',
  '''^README\.md$''',
  '''^\.github/workflows/.*\.yml$''',
  '''^supabase/.*\.sql$''',
  '''^scripts/.*\.ps1$''',
  # Catálogos de seed usam `key: 'nome_da_missao'` (identificador de jogo),
  # que a regra genérica de API key confunde com um segredo. Nunca há
  # segredo real em dados de jogo.
  '''^lib/data/seed/.*\.dart$''',
]
regexes = [
  '''SUPABASE_ANON_KEY=''',
  '''ANDROID_KEYSTORE_BASE64''',
  '''secrets\.[A-Z_]+''',
  '''service_role''',
]
